services:
  exporter:
    image: python:3.12-slim
    command: ["python", "/app/exporter.py"]
    environment:
      ARTIFACT_ROOT: /artifacts
    volumes:
      - ./exporter.py:/app/exporter.py:ro
      - ${ADAS_ARTIFACT_DIR:-../artifacts}:/artifacts:ro
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.6.0
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-arun}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in environment}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
volumes:
  prometheus-data:
  grafana-data:
